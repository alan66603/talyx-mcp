# Minimal Alertmanager config for the demo: it receives and groups alerts so
# you can see them in the Alertmanager UI. Wire in a real receiver (Slack,
# PagerDuty, email, webhook) for actual notifications.
route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: default
