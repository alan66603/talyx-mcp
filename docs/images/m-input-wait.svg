<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160" role="img" aria-label="cycle_duration minus input_wait: the time spent waiting for a human is cut out, leaving the server-side residual, which is what you alert on">
  <style>
    svg { --fg: #1f2328; --mu: #59636e; --ln: #d0d7de; --card: #f6f8fa; --acc: #e6522c; --ok: #1a7f37; --bad: #cf222e; }
    @media (prefers-color-scheme: dark) { svg { --fg: #e6edf3; --mu: #9198a1; --ln: #3d444d; --card: #151b23; --ok: #3fb950; --bad: #f85149; } }
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: var(--fg); }
    .mu { fill: var(--mu); } .acc { fill: var(--acc); } .ok { fill: var(--ok); } .bad { fill: var(--bad); }
    .frame { fill: var(--card); stroke: var(--ln); } .ln { stroke: var(--ln); }
    .srv { fill: var(--fg); } .wait { fill: var(--acc); }
    .title { font-size: 12px; font-weight: 700; } .tag { font-size: 10px; fill: var(--mu); }

    .g { transform-box: fill-box; transform-origin: left center; }
    .gA  { animation: gA  9000ms linear infinite; } @keyframes gA  { 0%      { transform: scaleX(0); opacity: 1; } 8%, 95.2% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    .gW  { animation: gW  9000ms linear infinite; } @keyframes gW  { 0%, 8%  { transform: scaleX(0); opacity: 1; } 32%, 95.2% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    .gB  { animation: gB  9000ms linear infinite; } @keyframes gB  { 0%, 32%  { transform: scaleX(0); opacity: 1; } 40%, 95.2% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    .gA2 { animation: gA2 9000ms ease-out infinite; } @keyframes gA2 { 0%, 49.6% { transform: scaleX(0); opacity: 1; } 54.4%, 95.2% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    .gB2 { animation: gB2 9000ms ease-out infinite; } @keyframes gB2 { 0%, 54.4% { transform: scaleX(0); opacity: 1; } 59.2%, 95.2% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    .f18 { animation: f18 9000ms ease-out infinite; } @keyframes f18 { 0%, 32% { opacity: 0; } 35.2%, 95.2% { opacity: 1; } 100% { opacity: 0; } }
    .f54 { animation: f54 9000ms ease-out infinite; } @keyframes f54 { 0%, 43.2% { opacity: 0; } 46.4%, 95.2% { opacity: 1; } 100% { opacity: 0; } }
    .f76 { animation: f76 9000ms ease-out infinite; } @keyframes f76 { 0%, 60.8% { opacity: 0; } 64%, 95.2% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect class="frame" x=".75" y=".75" width="398.5" height="158.5" rx="12" stroke-width="1.5"/>
  <text class="title" x="16" y="26">cycle_duration − input_wait</text>
  <text class="tag" x="384" y="26" text-anchor="end">histogram × 2</text>

  <!-- row 1: the whole cycle -->
  <rect class="g gA srv" x="40"  y="48" width="56"  height="16" rx="3"/>
  <rect class="g gW wait" x="96" y="48" width="184" height="16" rx="3" fill-opacity=".3"/>
  <rect class="g gB srv" x="280" y="48" width="56"  height="16" rx="3"/>
  <text class="f18 acc" x="188" y="60" font-size="10" font-weight="700" text-anchor="middle">input_wait (human)</text>
  <g class="f54">
    <path class="ln" d="M40 70 L40 76 L336 76 L336 70" fill="none" stroke-width="1.5"/>
    <text class="mu" x="188" y="90" font-size="10" text-anchor="middle">cycle_duration</text>
  </g>

  <!-- row 2: what's left once the human wait is cut out -->
  <rect class="g gA2 srv" x="40" y="106" width="56" height="16" rx="3"/>
  <rect class="g gB2 srv" x="96" y="106" width="56" height="16" rx="3"/>
  <line class="ln f76" x1="96" y1="104" x2="96" y2="124" stroke-width="2"/>
  <text class="f76" x="162" y="118" font-size="10" font-weight="700">server residual → alert on this</text>

  <text class="mu" x="16" y="148" font-size="10">slow human ≠ slow server</text>
</svg>
