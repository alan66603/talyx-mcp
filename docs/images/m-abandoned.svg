<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160" role="img" aria-label="talyx_abandoned_cycles_total: the server asks for input, the wait window runs out with no reply, and the cycle is counted as abandoned — no error reply, just silence">
  <style>
    svg { --fg: #1f2328; --mu: #59636e; --ln: #d0d7de; --card: #f6f8fa; --acc: #e6522c; --ok: #1a7f37; --bad: #cf222e; }
    @media (prefers-color-scheme: dark) { svg { --fg: #e6edf3; --mu: #9198a1; --ln: #3d444d; --card: #151b23; --ok: #3fb950; --bad: #f85149; } }
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: var(--fg); }
    .mu { fill: var(--mu); } .acc { fill: var(--acc); } .ok { fill: var(--ok); } .bad { fill: var(--bad); }
    .frame { fill: var(--card); stroke: var(--ln); } .ln { stroke: var(--ln); } .node { fill: var(--card); stroke: var(--fg); }
    .dacc { fill: var(--acc); } .smu { stroke: var(--mu); }
    .title { font-size: 12px; font-weight: 700; } .tag { font-size: 10px; fill: var(--mu); }

    .res { animation: res 8200ms ease-in-out infinite; }
    @keyframes res { 0% { transform: translateX(0); opacity: 0; } 2.34% { opacity: 1; } 17.17% { transform: translateX(-220px); opacity: 1; } 19.51%, 100% { transform: translateX(-220px); opacity: 0; } }
    .ring { stroke-dasharray: 1; animation: ring 8200ms linear infinite; }
    @keyframes ring { 0%, 18.73% { stroke-dashoffset: 1; opacity: 1; } 54.63% { stroke-dashoffset: 0; opacity: 1; } 57.76%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    .wt { animation: wt 8200ms linear infinite; }
    @keyframes wt { 0%, 18.73% { opacity: 0; } 21.07%, 53.07% { opacity: 1; } 55.41%, 100% { opacity: 0; } }
    .ghost { animation: ghost 8200ms ease-out infinite; }
    @keyframes ghost { 0%, 54.63% { opacity: 1; } 59.32%, 95.32% { opacity: .25; } 100% { opacity: 1; } }
    .ab { animation: ab 8200ms ease-out infinite; }
    @keyframes ab { 0%, 55.41% { opacity: 0; } 58.54%, 95.32% { opacity: 1; } 100% { opacity: 0; } }
    .pop { animation: pop 8200ms ease-out infinite; }
    @keyframes pop { 0%, 56.2% { opacity: 0; transform: translateY(4px); } 58.54% { opacity: 1; transform: translateY(0); } 71.8%, 100% { opacity: 0; transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .res, .wt, .pop { opacity: 0; } }
  </style>

  <rect class="frame" x=".75" y=".75" width="398.5" height="158.5" rx="12" stroke-width="1.5"/>
  <text class="title" x="16" y="26">talyx_abandoned_cycles_total</text>
  <text class="tag" x="384" y="26" text-anchor="end">counter</text>

  <!-- the reply lane stays empty -->
  <line class="ln" x1="84" y1="96" x2="300" y2="96" stroke-width="1.5" stroke-dasharray="3 5"/>

  <g class="res">
    <circle class="dacc" cx="292" cy="96" r="4.5"/>
    <text class="acc" x="292" y="84" font-size="10" text-anchor="middle">input_required</text>
  </g>

  <g class="ghost">
    <circle class="node" cx="60" cy="96" r="12" stroke-width="2"/>
  </g>
  <circle class="ring smu" pathLength="1" cx="60" cy="96" r="20" fill="none" stroke-width="2.5" stroke-linecap="round" transform="rotate(-90 60 96)"/>
  <text class="wt mu" x="60" y="134" font-size="10" text-anchor="middle">waiting…</text>
  <text class="ab bad" x="60" y="134" font-size="11" font-weight="700" text-anchor="middle">abandoned</text>
  <text class="pop bad" x="84" y="74" font-size="13" font-weight="700">+1</text>

  <rect class="node" x="300" y="74" width="84" height="44" rx="8" stroke-width="1.5"/>
  <text x="342" y="100" font-size="11" text-anchor="middle">server</text>

  <text class="mu" x="16" y="148" font-size="10">no error reply · just silence</text>
</svg>
