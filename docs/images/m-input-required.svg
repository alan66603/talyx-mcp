<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160" role="img" aria-label="talyx_input_required_total: a tools/call reaches the server, which answers input_required instead of a result; talyx counts +1">
  <style>
    svg { --fg: #1f2328; --mu: #59636e; --ln: #d0d7de; --card: #f6f8fa; --acc: #e6522c; --ok: #1a7f37; --bad: #cf222e; }
    @media (prefers-color-scheme: dark) { svg { --fg: #e6edf3; --mu: #9198a1; --ln: #3d444d; --card: #151b23; --ok: #3fb950; --bad: #f85149; } }
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: var(--fg); }
    .mu { fill: var(--mu); } .acc { fill: var(--acc); } .ok { fill: var(--ok); } .bad { fill: var(--bad); }
    .frame { fill: var(--card); stroke: var(--ln); } .ln { stroke: var(--ln); } .node { fill: var(--card); stroke: var(--fg); }
    .dot { fill: var(--fg); } .dacc { fill: var(--acc); } .sacc { stroke: var(--acc); }
    .title { font-size: 12px; font-weight: 700; } .tag { font-size: 10px; fill: var(--mu); }

    .req { animation: req 7400ms ease-in-out infinite; }
    @keyframes req { 0% { transform: translateX(0); opacity: 0; } 3.03% { opacity: 1; } 22.7% { transform: translateX(232px); opacity: 1; } 23.46%, 100% { transform: translateX(232px); opacity: 0; } }
    .gate { animation: gate 7400ms ease-out infinite; }
    @keyframes gate { 0%, 21.95% { opacity: 0; } 24.22%, 31.78% { opacity: 1; } 43.89%, 100% { opacity: 0; } }
    .res { animation: res 7400ms ease-in-out infinite; }
    @keyframes res { 0%, 24.97% { transform: translateX(0); opacity: 0; } 27.24% { opacity: 1; } 45.41% { transform: translateX(-232px); opacity: 1; } 48.43%, 100% { transform: translateX(-232px); opacity: 0; } }
    .resl { animation-name: resl; }
    @keyframes resl { 0%, 24.97% { transform: translateX(0); opacity: 0; } 27.24% { opacity: 1; } 34.81% { opacity: 1; } 39.35% { opacity: 0; } 45.41%, 100% { transform: translateX(-232px); opacity: 0; } }
    .hit { transform-box: fill-box; transform-origin: center; animation: hit 7400ms ease-out infinite; }
    @keyframes hit { 0%, 44.65% { opacity: 0; transform: scale(1); } 46.16% { opacity: .8; } 60.54%, 100% { opacity: 0; transform: scale(2.2); } }
    .pop { animation: pop 7400ms ease-out infinite; }
    @keyframes pop { 0%, 45.41% { opacity: 0; transform: translateY(4px); } 47.68%, 95.46% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .req, .gate, .hit, .pop { opacity: 0; } }
  </style>

  <rect class="frame" x=".75" y=".75" width="398.5" height="158.5" rx="12" stroke-width="1.5"/>
  <text class="title" x="16" y="26">talyx_input_required_total</text>
  <text class="tag" x="384" y="26" text-anchor="end">counter</text>

  <line class="ln" x1="52" y1="88" x2="300" y2="88" stroke-width="1.5"/>
  <line class="ln" x1="52" y1="104" x2="300" y2="104" stroke-width="1.5"/>

  <circle class="req dot" cx="62" cy="88" r="4.5"/>
  <g class="res">
    <circle class="dacc" cx="292" cy="104" r="4.5"/>
  </g>
  <text class="res resl acc" x="292" y="124" font-size="10" text-anchor="middle">input_required</text>

  <circle class="node" cx="40" cy="96" r="12" stroke-width="2"/>
  <circle class="hit sacc" cx="40" cy="96" r="12" fill="none" stroke-width="2"/>
  <text class="mu" x="40" y="128" font-size="10" text-anchor="middle">client</text>
  <text class="pop acc" x="58" y="76" font-size="13" font-weight="700">+1</text>

  <rect class="node" x="300" y="74" width="84" height="44" rx="8" stroke-width="1.5"/>
  <rect class="gate sacc" x="300" y="74" width="84" height="44" rx="8" fill="none" stroke-width="2.5"/>
  <text x="342" y="100" font-size="11" text-anchor="middle">server</text>

  <text class="mu" x="16" y="148" font-size="10">resultType == "input_required"</text>
  <text class="mu" x="384" y="148" font-size="10" text-anchor="end">→ one cycle begins</text>
</svg>
