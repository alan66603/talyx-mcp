<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160" role="img" aria-label="talyx_errors_total: JSON-RPC error responses are counted by error_code, and tool results with isError are counted as app_error; successful replies are not counted">
  <style>
    svg { --fg: #1f2328; --mu: #59636e; --ln: #d0d7de; --card: #f6f8fa; --acc: #e6522c; --ok: #1a7f37; --bad: #cf222e; }
    @media (prefers-color-scheme: dark) { svg { --fg: #e6edf3; --mu: #9198a1; --ln: #3d444d; --card: #151b23; --ok: #3fb950; --bad: #f85149; } }
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: var(--fg); }
    .mu { fill: var(--mu); } .acc { fill: var(--acc); } .ok { fill: var(--ok); } .bad { fill: var(--bad); }
    .frame { fill: var(--card); stroke: var(--ln); } .ln { stroke: var(--ln); } .node { fill: var(--card); stroke: var(--fg); }
    .dot { fill: var(--fg); } .dok { fill: var(--ok); } .dbad { fill: var(--bad); } .hl { fill: var(--bad); }
    .title { font-size: 12px; font-weight: 700; } .tag { font-size: 10px; fill: var(--mu); }

    .o1 { animation: o1 8200ms ease-in-out infinite; } @keyframes o1 { 0%, 1.56%  { transform: translateX(0); opacity: 1; } 7.8% { transform: translateX(104px); opacity: 1; } 8.2%, 100% { transform: translateX(104px); opacity: 0; } }
    .b1 { animation: b1 8200ms ease-in-out infinite; } @keyframes b1 { 0%, 7.8% { transform: translateX(0); opacity: 0; } 8.2% { opacity: 1; } 14.05% { transform: translateX(-104px); opacity: 1; } 14.83%, 100% { transform: translateX(-104px); opacity: 0; } }
    .o2 { animation: o2 8200ms ease-in-out infinite; } @keyframes o2 { 0%, 21.85% { transform: translateX(0); opacity: 0; } 22.24% { opacity: 1; } 28.1% { transform: translateX(104px); opacity: 1; } 28.49%, 100% { transform: translateX(104px); opacity: 0; } }
    .b2 { animation: b2 8200ms ease-in-out infinite; } @keyframes b2 { 0%, 28.1% { transform: translateX(0); opacity: 0; } 28.49% { opacity: 1; } 34.34% { transform: translateX(-104px); opacity: 1; } 35.12%, 100% { transform: translateX(-104px); opacity: 0; } }
    .o3 { animation: o3 8200ms ease-in-out infinite; } @keyframes o3 { 0%, 42.15% { transform: translateX(0); opacity: 0; } 42.54% { opacity: 1; } 48.39% { transform: translateX(104px); opacity: 1; } 48.78%, 100% { transform: translateX(104px); opacity: 0; } }
    .b3 { animation: b3 8200ms ease-in-out infinite; } @keyframes b3 { 0%, 48.39% { transform: translateX(0); opacity: 0; } 48.78% { opacity: 1; } 54.63% { transform: translateX(-104px); opacity: 1; } 55.41%, 100% { transform: translateX(-104px); opacity: 0; } }
    /* the ok reply: shown, then shrugged off */
    .skip { animation: skip 8200ms ease-out infinite; } @keyframes skip { 0%, 14.05% { opacity: 0; } 14.83%, 20.29% { opacity: 1; } 23.41%, 100% { opacity: 0; } }

    .w2 { animation: w2 8200ms linear infinite; } @keyframes w2 { 0%, 34.34% { opacity: 1; } 34.73%, 95.32% { opacity: 0; } 100% { opacity: 1; } }
    .n2 { animation: n2 8200ms linear infinite; } @keyframes n2 { 0%, 34.34% { opacity: 0; } 34.73%, 95.32% { opacity: 1; } 100% { opacity: 0; } }
    .w3 { animation: w3 8200ms linear infinite; } @keyframes w3 { 0%, 54.63% { opacity: 1; } 55.02%, 95.32% { opacity: 0; } 100% { opacity: 1; } }
    .n3 { animation: n3 8200ms linear infinite; } @keyframes n3 { 0%, 54.63% { opacity: 0; } 55.02%, 95.32% { opacity: 1; } 100% { opacity: 0; } }
    .h2 { animation: h2 8200ms ease-out infinite; } @keyframes h2 { 0%, 34.34% { opacity: 0; } 35.12% { opacity: .16; } 43.71%, 100% { opacity: 0; } }
    .h3 { animation: h3 8200ms ease-out infinite; } @keyframes h3 { 0%, 54.63% { opacity: 0; } 55.41% { opacity: .16; } 64%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .o1, .b1, .o2, .b2, .o3, .b3, .skip, .h2, .h3, .w2, .w3 { opacity: 0; } }
  </style>

  <rect class="frame" x=".75" y=".75" width="398.5" height="158.5" rx="12" stroke-width="1.5"/>
  <text class="title" x="16" y="26">talyx_errors_total</text>
  <text class="tag" x="384" y="26" text-anchor="end">counter</text>

  <!-- lane -->
  <line class="ln" x1="52" y1="88" x2="164" y2="88" stroke-width="1.5"/>
  <circle class="o1 dot" cx="56" cy="88" r="4.5"/>
  <circle class="b1 dok" cx="160" cy="88" r="4.5"/>
  <circle class="o2 dot" cx="56" cy="88" r="4.5"/>
  <g class="b2"><circle class="dbad" cx="160" cy="88" r="4.5"/><text class="bad" x="160" y="76" font-size="9" text-anchor="middle">-32601</text></g>
  <circle class="o3 dot" cx="56" cy="88" r="4.5"/>
  <g class="b3"><circle class="dbad" cx="160" cy="88" r="4.5"/><text class="bad" x="160" y="76" font-size="9" text-anchor="middle">-32603</text></g>

  <circle class="node" cx="40" cy="88" r="12" stroke-width="2"/>
  <rect class="node" x="164" y="70" width="52" height="36" rx="8" stroke-width="1.5"/>
  <text x="190" y="92" font-size="10" text-anchor="middle">server</text>
  <text class="mu" x="40" y="118" font-size="10" text-anchor="middle">client</text>
  <text class="skip ok" x="40" y="66" font-size="9" text-anchor="middle">ok · not counted</text>

  <!-- error_code table -->
  <g font-size="10">
    <text class="mu" x="236" y="46">error_code</text>

    <rect class="h2 hl" x="230" y="51" width="164" height="18" rx="4"/>
    <text class="bad" x="236" y="64">-32601</text><text class="mu" x="304" y="64" font-size="9">not found</text>
    <text class="w2" x="390" y="64" text-anchor="end">3</text><text class="n2" x="390" y="64" text-anchor="end" font-weight="700">4</text>

    <text class="bad" x="236" y="82">-32602</text><text class="mu" x="304" y="82" font-size="9">invalid params</text>
    <text x="390" y="82" text-anchor="end">1</text>

    <rect class="h3 hl" x="230" y="87" width="164" height="18" rx="4"/>
    <text class="bad" x="236" y="100">-32603</text><text class="mu" x="304" y="100" font-size="9">internal</text>
    <text class="w3" x="390" y="100" text-anchor="end">2</text><text class="n3" x="390" y="100" text-anchor="end" font-weight="700">3</text>

    <text class="bad" x="236" y="118">app_error</text><text class="mu" x="304" y="118" font-size="9">tool isError</text>
    <text x="390" y="118" text-anchor="end">2</text>
  </g>

  <text class="mu" x="16" y="148" font-size="10">JSON-RPC errors + tool isError · by error_code</text>
</svg>
