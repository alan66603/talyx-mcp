[project]
name = "talyx-mcp"
version = "0.1.0"
description = "Prometheus exporter and alerting proxy for MCP servers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-prometheus>=0.65b0",
]

[project.optional-dependencies]
# Optional OTLP metrics export (TALYX_OTLP_ENDPOINT). Kept out of the default
# install so a plain deployment stays lean and needs no OTLP toolchain.
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.44"]

[project.scripts]
talyx = "talyx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talyx"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
